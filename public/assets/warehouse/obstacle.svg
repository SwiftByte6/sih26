<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260">
<defs>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9642d"/><stop offset=".5" stop-color="#7b421f"/><stop offset="1" stop-color="#4d2818"/></linearGradient>
 <linearGradient id="plank" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9b5728"/><stop offset="1" stop-color="#63351e"/></linearGradient>
</defs>
<!-- shadow -->
<ellipse cx="150" cy="238" rx="112" ry="12" fill="#000" opacity=".16"/>
<!-- crate outer body -->
<rect x="35" y="28" width="230" height="195" rx="9" fill="url(#wood)" stroke="#432515" stroke-width="5"/>
<!-- top/bottom frame -->
<rect x="42" y="35" width="216" height="22" rx="3" fill="#a96832" stroke="#4b2919" stroke-width="3"/>
<rect x="42" y="194" width="216" height="22" rx="3" fill="#8d4d25" stroke="#4b2919" stroke-width="3"/>
<!-- side frame -->
<rect x="42" y="52" width="20" height="145" rx="3" fill="#8f4f27" stroke="#4b2919" stroke-width="3"/>
<rect x="238" y="52" width="20" height="145" rx="3" fill="#8f4f27" stroke="#4b2919" stroke-width="3"/>
<!-- dark recessed opening -->
<rect x="63" y="58" width="174" height="135" rx="3" fill="#3b2116" stroke="#4b2919" stroke-width="4"/>
<!-- vertical wooden slats -->
<g fill="url(#plank)" stroke="#3b2116" stroke-width="2">
 <rect x="70" y="61" width="14" height="129" rx="2"/>
 <rect x="88" y="61" width="14" height="129" rx="2"/>
 <rect x="106" y="61" width="14" height="129" rx="2"/>
 <rect x="124" y="61" width="14" height="129" rx="2"/>
 <rect x="142" y="61" width="14" height="129" rx="2"/>
 <rect x="160" y="61" width="14" height="129" rx="2"/>
 <rect x="178" y="61" width="14" height="129" rx="2"/>
 <rect x="196" y="61" width="14" height="129" rx="2"/>
 <rect x="214" y="61" width="14" height="129" rx="2"/>
</g>
<!-- corner bolts -->
<g fill="#b9b9b4" stroke="#3e3e3c" stroke-width="2">
 <circle cx="48" cy="43" r="6"/><circle cx="252" cy="43" r="6"/>
 <circle cx="48" cy="205" r="6"/><circle cx="252" cy="205" r="6"/>
</g>
<!-- bolt highlights -->
<g fill="#e5e3dc" opacity=".65">
 <circle cx="46" cy="41" r="2"/><circle cx="250" cy="41" r="2"/>
 <circle cx="46" cy="203" r="2"/><circle cx="250" cy="203" r="2"/>
</g>
</svg>